repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.17.6
  hooks:
    # Run the linter.
    - id: ruff-check
      files: ^src/
    # Run the formatter.
    - id: ruff-format
      files: ^src/
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.5.1
  hooks:
    -   id: mypy
        args: [--strict]