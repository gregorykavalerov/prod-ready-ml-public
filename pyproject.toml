[project]
name = "animal-shelter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gregory Kavalerov", email = "gregory.kavalerov@ah.nl" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "scikit-learn>=1.8.0",
    "pydantic>=2.10.0",
    "prometheus-client>=0.21.0",
    "cli",
]

[project.scripts]
animal-shelter = "animal_shelter:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "jupyter>=1.1.1",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv.sources]
cli = { workspace = true }

[tool.uv.workspace]
members = [
    "notebooks/cli/cli",
    "cli",
    "packages/cli",
]
